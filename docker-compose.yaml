services:
  server:
    build: .
    container_name: redis_like
    environment:
      PORT: "${APP_PORT}"
    ports:
      - "${SERVER_PORT}:9000"
    restart: always
    cpus: "1.0"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://localhost:9000/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s