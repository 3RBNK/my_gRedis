name: ci.yml
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [-n "$files"]; then
               echo "Run gofmt for files:"
               echo "$files"
               exit 1
          fi

      - name: Download dependency
        run: go mod download

      - name: Analyze code
        run: go vet ./...

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Build Docker image
        run: docker build -t redis-like:ci .
